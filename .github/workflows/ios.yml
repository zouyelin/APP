name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 工程依赖（swift-nio 2.101.3 / swift-log 1.15 / async-http-client 1.36 /
      # swift-crypto 4.5.1 等）要求 Swift tools 6.1~6.2；
      # macos-15 runner 默认是 Xcode 16.4 (Swift 6.0)，直接 make 会在
      # "Could not resolve package dependencies" 处失败，所以先切到 Xcode 26。
      - name: Select Xcode 26
        run: |
          set -e
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XC" ]; then
            echo "::error::runner 上没有 Xcode 26，现有版本："
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "使用 $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          sw_vers -productVersion

      # 仓库根目录可能直接是工程，也可能套了一层 APP/，这里统一找到含 Makefile 的目录
      - name: Locate project root
        id: root
        run: |
          set -e
          ROOT="$PWD"
          if [ ! -f Makefile ]; then
            MK=$(find . -maxdepth 3 -name Makefile -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$MK" ]; then ROOT="$(cd "$(dirname "$MK")" && pwd)"; fi
          fi
          echo "PROJECT_DIR=$ROOT"
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"

      # 工程默认不带共享 scheme，xcodebuild -scheme APP 会找不到，这里补一个
      # （BlueprintIdentifier 与工程里的 APP 目标一致，已验证）
      - name: Ensure shared scheme
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set -e
          SD="APP.xcodeproj/xcshareddata/xcschemes"
          if [ -f "$SD/APP.xcscheme" ]; then
            echo "scheme 已存在，跳过"
          else
            mkdir -p "$SD"
            python3 -c "import base64,gzip,pathlib;pathlib.Path('$SD/APP.xcscheme').write_bytes(gzip.decompress(base64.b64decode('')))"
            echo "scheme 已创建"
          fi
          xcodebuild -list -project APP.xcodeproj

      - name: Compile
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set -o pipefail
          make 2>&1 | tee /tmp/build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Verify ipa
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set -e
          test -s APP.ipa || { echo "::error::make 没有产出 APP.ipa"; exit 1; }
          ls -lh APP.ipa
          unzip -l APP.ipa | head -n 15

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: APP
          path: ${{ steps.root.outputs.dir }}/APP.ipa
          if-no-files-found: error
