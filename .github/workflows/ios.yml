name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          sw_vers -productVersion

      - name: Ensure shared scheme
        run: |
          set -e
          ROOT="$PWD"
          if [ ! -f Makefile ]; then
            MK=$(find . -maxdepth 3 -name Makefile -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$MK" ]; then ROOT="$(cd "$(dirname "$MK")" && pwd)"; fi
          fi
          cd "$ROOT"
          echo "PROJECT_DIR=$ROOT"
          SD="APP.xcodeproj/xcshareddata/xcschemes"
          if [ -f "$SD/APP.xcscheme" ]; then
            echo "scheme already exists (skip)"
          else
            mkdir -p "$SD"
            python3 -c "import base64,gzip,pathlib;pathlib.Path('$SD/APP.xcscheme').write_bytes(gzip.decompress(base64.b64decode('')))"
            echo "scheme created"
          fi
          xcodebuild -list -project APP.xcodeproj

      - name: Build
        run: |
          set -o pipefail
          make 2>&1 | tee /tmp/build.log

      - name: Verify ipa
        run: |
          set -e
          test -s APP.ipa || { echo "::error::APP.ipa was not produced by make"; exit 1; }
          ls -lh APP.ipa
          unzip -l APP.ipa | head -n 15

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: APP-ipa
          path: APP.ipa
          if-no-files-found: error
